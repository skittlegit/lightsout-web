name: Refresh base data
on:
  schedule:
    - cron: "30 3 * * 2"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-base-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh calendar and standings snapshot
        run: node scripts/refresh-base-data.mjs
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/base-data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh calendar and standings"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
